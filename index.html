<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endless Geography Trivia V13.0</title>

<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body><div class="wrap">
<section id="menu" class="menu"><div class="menuin"><div class="kicker">ENDLESS GEOGRAPHY</div><h1>Choose your challenge.</h1><p id="countryDataStatus" class="muted">Country database: loading expanded coverage…</p><label class="option refreshOption" title="Updates country populations from the World Bank when online. The game works fully without it. Turning it off applies after a reload."><input id="liveRefresh" type="checkbox" checked> Refresh populations online (optional)</label><section class="settings"><h2>Difficulty</h2><div class="difficulty"><input name="difficulty" id="easy" value="easy" type="radio"><label for="easy">Easy<small>20 seconds</small></label><input name="difficulty" id="normal" value="normal" type="radio" checked><label for="normal">Normal<small>10 seconds</small></label><input name="difficulty" id="hard" value="hard" type="radio"><label for="hard">Hard<small>5 seconds</small></label><input name="difficulty" id="extreme" value="extreme" type="radio"><label for="extreme">Extreme<small>3 seconds</small></label></div></section><section class="settings"><h2>Expertise</h2><div class="difficulty expertise"><input name="expertise" id="novice" value="novice" type="radio"><label for="novice">Novice<small>Top 70 countries</small></label><input name="expertise" id="intermediate" value="intermediate" type="radio" checked><label for="intermediate">Intermediate<small>Top 120 countries</small></label><input name="expertise" id="pro" value="pro" type="radio"><label for="pro">Pro<small>Top 180 countries</small></label><input name="expertise" id="expert" value="expert" type="radio"><label for="expert">Expert<small>All countries</small></label></div></section><div class="modes"><div><button class="mode" data-mode="flag">🚩<b>Flag Mode</b><span class="muted">Identify flags.</span></button><label class="option"><input id="studyMode" type="checkbox"> Study Mode</label></div><div><button class="mode" data-mode="map">🗺️<b>Map Mode</b><span class="muted">Find countries.</span></button><label class="option"><input id="showNames" type="checkbox" checked> Show names on hover</label><label class="option"><input id="showFlags" type="checkbox"> Show hovered flag</label></div><button class="mode" data-mode="trivia">🧠<b>Country Trivia</b><span class="muted">Answer on the map.</span></button></div></div></section>
<section id="game" class="hidden"><div class="gamegrid"><main><header class="head"><div><button id="backBtn" type="button">← Change mode</button><div class="kicker" id="modeLabel"></div><h1 id="question" aria-live="polite"></h1><div id="questionActions" class="questionActions hidden"><span id="selectionProgress" class="selectionProgress">Selected: 0 / 1</span><button id="confirmSelection" class="confirmSelection" type="button" disabled>Confirm Selection</button></div></div><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Time</small><b id="time">10s</b></div></div></header><div class="timerTrack"><div id="timerBar" class="timerBar"></div></div><section class="card play"><div id="reaction" class="reaction" role="status"></div><div id="revealNotice" class="revealNotice hidden"></div><div id="flagArea" class="flagbox"><img id="flag"></div><div id="mapWrap" class="mapWrap hidden"><div id="mapArea" class="map"></div><div class="mapControls" aria-label="Map controls"><button class="mapControl" type="button" title="Zoom in" id="zoomInBtn">+</button><button class="mapControl" type="button" title="Zoom out" id="zoomOutBtn">−</button><button class="mapControl reset" type="button" title="Reset map" id="zoomResetBtn">⌂</button></div><div class="mapHint">Drag to pan · Scroll or pinch to zoom</div><div id="hoverFlag" class="hoverFlag"><img id="hoverFlagImg"><span id="hoverFlagName"></span></div></div><div id="answers" class="answers"></div></section></main><aside class="card side"><h2 id="boardTitle">🏆 Top 10</h2><div id="board"></div></aside></div></section></div>
<div id="studyCard" class="studyCard hidden"><div class="studyInner"><div class="kicker">STUDY MODE</div><img id="studyFlag" class="studyFlag" alt="Correct flag"><h2 id="studyTitle"></h2><p id="studySummary"></p><div class="studyActions"><a id="studyReadMore" class="btn studyLink" target="_blank" rel="noopener noreferrer">Read more</a><button id="studyContinue" class="btn studyContinue" type="button">Continue</button></div></div></div>
<div id="modal" class="modal hidden"><div class="modalin"><div class="kicker" style="color:#fb7185">RUN OVER</div><h2>Final score: <span id="final"></span></h2><p>Correct answer: <b id="correct"></b></p><p id="reason"></p><div class="save"><input id="name" maxlength="20" placeholder="Player name"><button id="saveBtn" class="btn primary">Save</button></div><button id="againBtn" class="btn again" type="button">Play again</button></div></div>
<script src="js/util.js"></script>
<script src="js/data/flag-study.js"></script>
<script src="js/data/countries.js"></script>
<script src="js/countries.js"></script>
<script src="js/flags.js"></script>
<script src="js/questions.js"></script>
<script src="js/map.js"></script>
<script src="js/scores.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
