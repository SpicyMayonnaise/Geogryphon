<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geogryphon V14.0</title>

<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap">
<style>
/* Endless Geography Trivia styles */
:root {
  /* colour */
  --bg:#1b1446;
  --surface-1:#261d5e;
  --surface-2:#3b2f8f;
  --edge:#120d33;
  --text:#ffffff;
  --text-2:#b9b0ff;
  --accent:#ffd23f;
  --accent-edge:#c99c00;
  --on-accent:#1b1446;
  --hot:#ff5d73;
  --good:#3ee08f;
  --bad:#ff4d6d;
  --map-land:#4a3fb0;
  --map-sea:#140f38;
  --scrim:#0d0a26e6;
  --line:#ffffff1f;
  --flag-frame:#d5dde8;
  /* type */
  --font-display:'Fredoka',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
  --fs-12:.75rem;
  --fs-14:.875rem;
  --fs-18:1.125rem;
  --fs-28:1.75rem;
  --fs-44:2.75rem;
  /* fluid headline sizes: grow from a scale step with the viewport */
  --fs-hero:clamp(2.75rem,7vw,5rem);
  --fs-question:clamp(1.75rem,3vw,2.5rem);
  --fs-reaction:clamp(1.75rem,6vw,4.5rem);
  --fw-500:500;
  --fw-600:600;
  --fw-700:700;
  /* shape and space */
  --r-8:8px;
  --r-14:14px;
  --r-24:24px;
  --r-pill:999px;
  --s-4:4px;
  --s-8:8px;
  --s-12:12px;
  --s-16:16px;
  --s-24:24px;
  --s-32:32px;
  --pad:var(--s-16);
  /* motion */
  --press:120ms;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:var(--font-body);
  font-size:var(--fs-18);
  font-weight:var(--fw-500);
  color:var(--text);
  background:var(--bg);
}

button,input {
  font-family:inherit;
  font-size:inherit;
}

h1,h2,.stat b,.mode b {
  font-family:var(--font-display);
  font-weight:var(--fw-700);
}

.wrap {
  max-width:1900px;
  min-height:100vh;
  margin:auto;
  padding:var(--pad);
}

.hidden {
  display:none!important;
}

/* ---------- Button: pressable, with a darker bottom edge that squashes on press ---------- */

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--s-8);
  padding:var(--s-12) var(--s-16);
  border:0;
  border-radius:var(--r-14);
  font-family:var(--font-display);
  font-size:var(--fs-18);
  font-weight:var(--fw-600);
  text-decoration:none;
  cursor:pointer;
  transition:transform var(--press),box-shadow var(--press),background var(--press);
}

.btn-primary {
  background:var(--accent);
  color:var(--on-accent);
  box-shadow:0 4px 0 var(--accent-edge);
}

.btn-secondary {
  background:var(--surface-2);
  color:var(--text);
  box-shadow:0 4px 0 var(--edge);
}

.btn-ghost {
  background:transparent;
  color:var(--text-2);
  box-shadow:inset 0 0 0 2px var(--surface-2);
}

.btn-primary:hover {
  filter:brightness(1.06);
}

.btn-secondary:hover,.btn-ghost:hover {
  color:var(--accent);
}

.btn-primary:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--accent-edge);
}

.btn-secondary:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--edge);
}

.btn:disabled {
  background:var(--surface-1);
  color:var(--text-2);
  box-shadow:none;
  filter:none;
  cursor:not-allowed;
  transform:none;
}

#backBtn {
  margin-bottom:var(--s-8);
  padding:var(--s-4) var(--s-12);
  font-size:var(--fs-14);
}

/* ---------- Cards ---------- */

.card,.settings,.mode,.modalin,.studyInner {
  background:var(--surface-1);
  border:0;
  border-radius:var(--r-24);
  color:var(--text);
}

/* ---------- Menu ---------- */

.menu {
  position:relative;
  min-height:92vh;
  min-height:92dvh;
  display:grid;
  place-items:center;
}

.menuin {
  max-width:1100px;
}

.kicker {
  color:var(--hot);
  font-family:var(--font-display);
  font-weight:var(--fw-700);
  font-size:var(--fs-14);
  letter-spacing:.14em;
  text-transform:uppercase;
}

.menu h1 {
  font-size:var(--fs-hero);
  line-height:1;
  margin:var(--s-12) 0;
}

.muted {
  color:var(--text-2);
}

.settings {
  margin:var(--s-16) 0;
  padding:var(--s-16) var(--s-24);
}

.settings h2 {
  margin:0 0 var(--s-12);
  font-size:var(--fs-18);
  color:var(--text-2);
}

/* Segmented control */
.difficulty {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--s-8);
}

.difficulty input {
  position:absolute;
  opacity:0;
}

.difficulty label {
  padding:var(--s-12);
  text-align:center;
  border-radius:var(--r-14);
  background:var(--surface-2);
  box-shadow:0 4px 0 var(--edge);
  font-family:var(--font-display);
  font-weight:var(--fw-600);
  cursor:pointer;
  transition:transform var(--press),box-shadow var(--press);
}

.difficulty label small {
  display:block;
  color:var(--text-2);
  font-family:var(--font-body);
  font-size:var(--fs-14);
}

.difficulty label:hover {
  color:var(--accent);
}

.difficulty input:checked+label {
  background:var(--accent);
  color:var(--on-accent);
  box-shadow:0 2px 0 var(--accent-edge);
  transform:translateY(2px);
}

.difficulty input:checked+label small {
  color:var(--on-accent);
}

/* Mode cards */
.modes {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--s-16);
}

.mode {
  width:100%;
  padding:var(--s-24);
  text-align:left;
  cursor:pointer;
  box-shadow:0 4px 0 var(--edge);
  transition:transform var(--press),box-shadow var(--press);
  font-size:var(--fs-28);
}

.mode:hover {
  box-shadow:0 4px 0 var(--edge),inset 0 0 0 2px var(--accent);
}

.mode:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--edge);
}

.mode b {
  display:block;
  font-size:var(--fs-28);
  margin:var(--s-12) 0 var(--s-4);
}

.mode .muted {
  font-size:var(--fs-14);
}

.option {
  display:flex;
  gap:var(--s-8);
  margin:var(--s-12);
  color:var(--text-2);
  font-weight:var(--fw-600);
  font-size:var(--fs-14);
}

.option input {
  width:18px;
  accent-color:var(--accent);
}

.option.refreshOption {
  margin:0 0 var(--s-8);
}

/* ---------- Game screen ---------- */

.gamegrid {
  display:grid;
  grid-template-columns:minmax(0,1fr) 230px;
  gap:var(--s-12);
}

/* The play column is exactly one viewport tall: header and timer keep their size,
   the play card takes the rest, so nothing needed during a run is below the fold. */
.gamegrid main {
  height:calc(100vh - 2 * var(--pad));
  height:calc(100dvh - 2 * var(--pad));
  min-height:420px;
  display:flex;
  flex-direction:column;
}

.head {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:var(--s-16);
  margin-bottom:var(--s-12);
  flex:none;
}

.head > div:first-child {
  min-width:0;
}

.head h1 {
  margin:var(--s-4) 0 0;
  font-size:var(--fs-question);
  line-height:1.1;
  overflow-wrap:anywhere;
}

/* Chip: the mode / difficulty tag above the question */
.head .kicker {
  display:inline-block;
  padding:var(--s-4) var(--s-12);
  border-radius:var(--r-pill);
  background:var(--hot);
  color:var(--on-accent);
  font-size:var(--fs-12);
  letter-spacing:.1em;
}

.questionActions {
  display:flex;
  align-items:center;
  gap:var(--s-12);
  flex-wrap:wrap;
  margin-top:var(--s-12);
}

.selectionProgress {
  min-width:120px;
  color:var(--text-2);
  font-weight:var(--fw-700);
  font-size:var(--fs-14);
}

/* Stat */
.stats {
  display:flex;
  gap:var(--s-8);
}

.stat {
  min-width:88px;
  padding:var(--s-8) var(--s-12);
  background:var(--surface-1);
  border-radius:var(--r-14);
}

.stat small {
  display:block;
  color:var(--text-2);
  font-size:var(--fs-12);
  font-weight:var(--fw-700);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.stat b {
  font-size:var(--fs-28);
  color:var(--good);
}

/* Timer */
.timerTrack {
  height:12px;
  background:var(--surface-1);
  border-radius:var(--r-pill);
  overflow:hidden;
  margin-bottom:var(--s-12);
  flex:none;
}

.timerBar {
  height:100%;
  border-radius:var(--r-pill);
  transform-origin:left;
}

.timerTrack.penalty {
  animation:timerPenalty .48s ease;
  background:var(--bad);
}

/* Play card */
.play {
  position:relative;
  padding:var(--s-8);
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:var(--s-12);
}

.flagbox {
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--s-8);
}

/* The frame hugs the flag (no letterbox), so white hoists stay distinct from it. */
.flagbox img {
  max-width:min(720px,100%);
  max-height:100%;
  object-fit:contain;
  background:var(--flag-frame);
  padding:var(--s-12);
  border-radius:var(--r-14);
  box-shadow:0 6px 0 var(--edge);
  transition:opacity .18s;
}

.flagbox img.loading,.hoverFlag img.loading {
  opacity:.35;
  filter:saturate(.35);
}

/* Answer tile */
.answers {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--s-12);
  flex:none;
}

.answers:empty {
  display:none;
}

.answer {
  min-height:64px;
  padding:var(--s-12) var(--s-16);
  text-align:left;
  border:0;
  border-radius:var(--r-14);
  background:var(--surface-2);
  color:var(--text);
  box-shadow:0 4px 0 var(--edge);
  font-family:var(--font-display);
  font-size:var(--fs-18);
  font-weight:var(--fw-600);
  overflow-wrap:anywhere;
  cursor:pointer;
  transition:transform var(--press),box-shadow var(--press);
}

.answer:hover {
  box-shadow:0 4px 0 var(--edge),inset 0 0 0 2px var(--accent);
}

.answer:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--edge);
}

.answer.is-correct {
  background:var(--good);
  color:var(--on-accent);
}

.answer.is-wrong {
  background:var(--bad);
  color:var(--on-accent);
}

/* Map */
.mapWrap {
  position:relative;
  width:100%;
  flex:1;
  min-height:0;
}

.map {
  position:absolute;
  inset:0;
  background:var(--map-sea);
  border-radius:var(--r-14);
  overflow:hidden;
}

.mapControls {
  position:absolute;
  left:var(--s-16);
  top:var(--s-16);
  z-index:8;
  display:grid;
  gap:var(--s-8);
  pointer-events:auto;
}

.mapControl {
  width:44px;
  height:44px;
  border:0;
  border-radius:var(--r-14);
  background:var(--surface-2);
  color:var(--text);
  box-shadow:0 4px 0 var(--edge);
  font-family:var(--font-display);
  font-size:var(--fs-28);
  font-weight:var(--fw-700);
  line-height:1;
  cursor:pointer;
  transition:transform var(--press),box-shadow var(--press);
}

.mapControl:hover {
  color:var(--accent);
}

.mapControl:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--edge);
}

.mapControl.reset {
  font-size:var(--fs-18);
}

/* Mute toggle: a map-control button in the menu corner and beside the game stats */
.muteBtn {
  flex:none;
  align-self:center;
  font-size:var(--fs-18);
}

.menuMute {
  position:absolute;
  top:var(--s-16);
  right:var(--s-16);
}

.mapHint {
  position:absolute;
  z-index:7;
  left:50%;
  bottom:var(--s-12);
  transform:translateX(-50%);
  padding:var(--s-4) var(--s-12);
  border-radius:var(--r-pill);
  background:var(--scrim);
  color:var(--text-2);
  font-size:var(--fs-12);
  pointer-events:none;
  white-space:nowrap;
}

.hoverFlag {
  position:absolute;
  right:var(--s-16);
  top:var(--s-16);
  z-index:5;
  width:155px;
  padding:var(--s-8);
  border-radius:var(--r-14);
  background:var(--surface-1);
  pointer-events:none;
  opacity:0;
  transition:.18s;
}

.hoverFlag.show {
  opacity:1;
}

.hoverFlag img {
  width:100%;
  height:85px;
  object-fit:contain;
  background:var(--flag-frame);
  border-radius:var(--r-8);
}

.hoverFlag span {
  display:block;
  text-align:center;
  font-weight:var(--fw-700);
}

/* Reactions and reveal */
.reaction,.revealNotice {
  position:absolute;
  z-index:15;
  left:50%;
  pointer-events:none;
  font-family:var(--font-display);
  font-weight:var(--fw-700);
  text-align:center;
}

.reaction {
  top:20%;
  font-size:var(--fs-reaction);
  opacity:0;
  -webkit-text-stroke:2px var(--edge);
  paint-order:stroke fill;
}

.reaction.show {
  animation:pop 1s ease;
}

.revealNotice {
  top:var(--s-16);
  transform:translateX(-50%);
  padding:var(--s-12) var(--s-16);
  border-radius:var(--r-14);
  background:var(--surface-1);
  color:var(--good);
  font-size:var(--fs-18);
}

/* Dashed ring drawn around a revealed country (map.js RevealCircles). */
.revealLayer {
  position:absolute;
  inset:0;
  z-index:6;
  width:100%;
  height:100%;
  border-radius:var(--r-14);
  pointer-events:none;
}

.revealCircle {
  fill:none;
  stroke:var(--text);
  stroke-width:4;
  stroke-dasharray:14 10;
  stroke-linecap:round;
  filter:drop-shadow(0 0 3px var(--edge));
}

/* Mask stroke that grows around the ring: white shows the ring, so it looks drawn on. */
.revealCircleMask {
  fill:none;
  stroke:var(--text);
  stroke-width:16;
}

/* Leaderboard */
.side {
  padding:var(--s-16);
  height:max-content;
  max-height:calc(100dvh - 2 * var(--pad));
  overflow-y:auto;
}

.side h2 {
  margin:0 0 var(--s-8);
  font-size:var(--fs-18);
}

.row {
  display:flex;
  gap:var(--s-8);
  padding:var(--s-8) var(--s-12);
  background:var(--surface-2);
  border-radius:var(--r-8);
  margin-top:var(--s-8);
  font-size:var(--fs-14);
}

.player {
  flex:1;
}

.rank {
  color:var(--accent);
}

.pts {
  color:var(--good);
}

/* ---------- Overlays: run-over modal and Study Mode card ---------- */

.modal,.studyCard {
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  padding:var(--s-16);
  background:var(--scrim);
}

.modal {
  z-index:30;
}

.studyCard {
  z-index:45;
}

.modalin {
  width:min(430px,100%);
  padding:var(--s-32) var(--s-24);
}

.modalin .kicker {
  color:var(--bad);
}

.save {
  display:flex;
  gap:var(--s-8);
}

.save input {
  flex:1;
  min-width:0;
  padding:var(--s-12);
  border-radius:var(--r-14);
  background:var(--bg);
  color:var(--text);
  border:2px solid var(--surface-2);
}

.again {
  width:100%;
  margin-top:var(--s-12);
}

.studyInner {
  width:min(620px,100%);
  padding:var(--s-24);
}

.studyFlag {
  display:block;
  width:min(330px,80%);
  height:175px;
  object-fit:contain;
  margin:0 auto var(--s-16);
  padding:var(--s-8);
  border-radius:var(--r-14);
  background:var(--flag-frame);
}

.studyInner h2 {
  margin:0 0 var(--s-8);
  font-size:var(--fs-28);
}

.studyInner p {
  color:var(--text-2);
  line-height:1.55;
  margin:0 0 var(--s-24);
}

.studyInner p.loading {
  font-style:italic;
}

.studyActions {
  display:flex;
  gap:var(--s-12);
  justify-content:flex-end;
  flex-wrap:wrap;
}

@keyframes timerPenalty {
  0%,100% {
    transform:translateX(0);
  }
  20% {
    transform:translateX(-13px);
  }
  40% {
    transform:translateX(11px);
  }
  60% {
    transform:translateX(-8px);
  }
  80% {
    transform:translateX(5px);
  }
}

@keyframes pop {
  0% {
    opacity:0;
    transform:translate(-50%,20px) scale(.5);
  }
  25% {
    opacity:1;
    transform:translate(-50%,0) scale(1.15);
  }
  100% {
    opacity:0;
    transform:translate(-50%,-30px);
  }
}

@media(max-width:1200px) {
  .gamegrid {
    grid-template-columns:1fr;
  }
  .side {
    order:2;
    max-height:none;
  }
}

@media(max-width:900px) {
  .modes {
    grid-template-columns:1fr;
  }
}

@media(max-width:620px) {
  :root {
    --pad:var(--s-8);
  }
  .difficulty,.answers {
    grid-template-columns:1fr 1fr;
  }
  .play {
    padding:var(--s-4);
  }
  .answer {
    min-height:52px;
    padding:var(--s-12);
  }
  /* Stats move up beside the back button so the question gets the full width. */
  .head {
    position:relative;
  }
  .stats {
    position:absolute;
    top:0;
    right:0;
  }
  .stat {
    min-width:0;
    padding:var(--s-4) var(--s-12);
    border-radius:var(--r-8);
    display:flex;
    align-items:baseline;
    gap:var(--s-8);
  }
  .stat b {
    font-size:var(--fs-18);
  }
  /* Same height as the back button, so the stats row does not grow into the mode chip below it. */
  .muteBtn {
    width:28px;
    height:28px;
    border-radius:var(--r-8);
    font-size:var(--fs-14);
  }
  /* Own line under the back button, so it never slides under the stats in the top-right corner. */
  .head .kicker {
    display:table;
    font-size:var(--fs-12);
  }
}

button:focus-visible,a:focus-visible,input:focus-visible,.difficulty input:focus-visible+label {
  outline:3px solid var(--accent);
  outline-offset:3px;
}

@media(prefers-reduced-motion:reduce) {
  * {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

</style>

<script>
/* Shared helpers.
   Every file in js/ is a classic <script>, so they all share one global scope and
   load order matters (see index.html). No build step is needed, and it works from file://. */

const $ = id => document.getElementById(id);
const setText = (id, text) => { $(id).textContent = text; };
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');

// Fisher-Yates, in place.
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// localStorage that never throws (private mode, sandboxed iframes, blocked storage).
const LS = {
  getItem(k) { try { return localStorage.getItem(k); } catch { return null; } },
  setItem(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
  removeItem(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } }
};

// Design tokens live in css/style.css (:root). JS reads them instead of hardcoding colours.
const token = name => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();

// amCharts wants colours as numbers (0xrrggbb).
function tokenHex(name) {
  const v = token(name);
  if (!/^#[0-9a-fA-F]{6}$/.test(v)) throw new Error(`Unknown colour token --${name}`);
  return parseInt(v.slice(1), 16);
}

// The big floating reaction text ("Nice!", "Wrong! -3 seconds", ...).
function showReaction(text, color = token('bad'), extra = 'penaltyBurst') {
  const e = $('reaction');
  e.textContent = text;
  e.style.color = color;
  e.className = 'reaction';
  void e.offsetWidth; // restart the CSS animation
  e.className = `reaction show ${extra}`;
}

</script>
<script>
/* Sound effects, made in code with the Web Audio API: no audio files, works from file:// and offline.
   The only file that touches audio. Every call is safe: with no Web Audio, before the first user
   gesture (browsers block audio until then), or while muted, Sound simply does nothing. */

const SOUND_MUTE_KEY = 'geogryphon.muted';
const HOVER_GAP_MS = 40;

const clamp01 = x => Math.min(1, Math.max(0, Number(x) || 0));
const lerp = (a, b, t) => a + (b - a) * t;

/* Each recipe turns an intensity (0..1) into notes:
   f = start pitch (Hz), f2 = end pitch for a glide, t = start offset (s), d = length (s),
   type = oscillator wave, v = peak volume (0..1), noise = a short noise burst instead of a tone. */
const SOUND_RECIPES = {
  hover: () => [{ f: 1760, t: 0, d: 0.03, type: 'sine', v: 0.04 }],
  click: () => [{ f: 440, f2: 220, t: 0, d: 0.07, type: 'triangle', v: 0.25 }],
  // Rising arpeggio: more notes, higher, brighter and louder the more time was left.
  correct: i => {
    const lift = lerp(1, 1.26, i);
    const step = lerp(0.09, 0.055, i);
    const type = i > 0.5 ? 'square' : 'triangle';
    const v = lerp(0.18, 0.3, i);
    const notes = [523.25, 659.25, 783.99, 1046.5].slice(0, Math.round(lerp(2, 4, i)))
      .map((f, k) => ({ f: f * lift, t: k * step, d: 0.12, type, v }));
    if (i >= 0.6) notes.push({ f: 2093 * lift, f2: 2637 * lift, t: notes.length * step, d: 0.3, type: 'sine', v: v / 2 });
    return notes;
  },
  // Falling "bonk": longer, lower, harsher and louder the more time was used.
  wrong: i => {
    const type = i > 0.5 ? 'sawtooth' : 'square';
    const v = lerp(0.16, 0.28, i);
    return [
      { f: lerp(330, 247, i), t: 0, d: 0.08, type, v },
      { f: lerp(262, 196, i), f2: lerp(220, 82, i), t: 0.09, d: lerp(0.12, 0.45, i), type, v }
    ];
  },
  tick: i => [{ f: lerp(900, 1200, i), t: 0, d: 0.035, type: 'square', v: lerp(0.07, 0.14, i) }],
  tickFinal: () => [
    { f: 1200, t: 0, d: 0.035, type: 'square', v: 0.15 },
    { f: 1500, t: 0.5, d: 0.035, type: 'square', v: 0.15 }
  ],
  timesUp: () => [
    { f: 220, t: 0, d: 0.25, type: 'square', v: 0.25 },
    { f: 165, t: 0.3, d: 0.35, type: 'square', v: 0.25 }
  ],
  runOver: () => [392, 329.63, 261.63, 196]
    .map((f, k) => ({ f, t: k * 0.15, d: k === 3 ? 0.45 : 0.13, type: 'triangle', v: 0.22 })),
  pick: () => [{ f: 660, f2: 990, t: 0, d: 0.07, type: 'sine', v: 0.18 }],
  unpick: () => [{ f: 990, f2: 660, t: 0, d: 0.07, type: 'sine', v: 0.14 }],
  full: () => [
    { f: 140, f2: 80, t: 0, d: 0.14, type: 'sine', v: 0.3 },
    { noise: true, t: 0, d: 0.05, v: 0.1 }
  ],
  saved: () => [
    { f: 783.99, t: 0, d: 0.1, type: 'triangle', v: 0.2 },
    { f: 1174.66, t: 0.1, d: 0.25, type: 'triangle', v: 0.2 }
  ]
};

const Sound = (() => {
  let ctx = null, master = null, noise = null, broken = false;
  let muted = LS.getItem(SOUND_MUTE_KEY) === '1';
  let lastHover = -Infinity, lastTick = null, wrongVoices = [], tickVoices = [];

  // Runs on every user gesture: creates the audio context on the first one and wakes it again if the
  // browser suspended (or, on iOS, interrupted) it.
  function unlock() {
    if (broken) return;
    try {
      if (!ctx) {
        const Ctx = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (!Ctx) { broken = true; return; }
        ctx = new Ctx();
        master = ctx.createGain();
        master.gain.value = 0.6;
        master.connect(ctx.destination);
      }
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
    } catch {
      broken = true;
      ctx = null;
    }
  }

  function noiseBuffer() {
    if (!noise) {
      noise = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.2), ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    }
    return noise;
  }

  // One note: a tone or noise burst through a quick attack and an exponential release (no clicks).
  function voice(n, at) {
    const start = at + n.t, end = start + n.d;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, start);
    env.gain.exponentialRampToValueAtTime(n.v, start + 0.005);
    env.gain.exponentialRampToValueAtTime(0.0001, end);
    env.connect(master);
    let src;
    if (n.noise) {
      src = ctx.createBufferSource();
      src.buffer = noiseBuffer();
    } else {
      src = ctx.createOscillator();
      src.type = n.type;
      src.frequency.setValueAtTime(n.f, start);
      if (n.f2) src.frequency.exponentialRampToValueAtTime(n.f2, end);
    }
    src.connect(env);
    src.start(start);
    src.stop(end + 0.02);
    return src;
  }

  const silence = voices => voices.forEach(v => { try { v.stop(); } catch { /* already stopped */ } });

  // delay (s) starts the sound later, so one sound can follow another.
  function play(name, intensity = 0, delay = 0) {
    // A context that is not running yet (e.g. a phone's first touch) would only queue a burst for later.
    if (muted || broken || !ctx || ctx.state !== 'running' || !SOUND_RECIPES[name]) return false;
    if (name === 'hover') {
      const now = performance.now();
      if (now - lastHover < HOVER_GAP_MS) return false;
      lastHover = now;
    }
    try {
      if (name === 'wrong') silence(wrongVoices); // repeated misses never stack
      const at = ctx.currentTime + 0.01 + Math.max(0, Number(delay) || 0);
      const voices = SOUND_RECIPES[name](clamp01(intensity)).map(n => voice(n, at));
      if (name === 'wrong') wrongVoices = voices;
      if (name === 'tick' || name === 'tickFinal') tickVoices = voices;
      return true;
    } catch {
      broken = true;
      return false;
    }
  }

  // The countdown calls this every frame while the timer is red; only a new whole second plays.
  function tick(secondsLeft) {
    if (secondsLeft === lastTick) return false;
    lastTick = secondsLeft;
    return secondsLeft <= 1 ? play('tickFinal') : play('tick', 1 - (secondsLeft - 1) / 5);
  }

  return {
    unlock,
    play,
    tick,
    // Re-arms the ticks and cuts a final-second tock that is still waiting to play.
    resetTick() {
      lastTick = null;
      silence(tickVoices);
      tickVoices = [];
    },
    isMuted: () => muted,
    setMuted(on) {
      muted = !!on;
      LS.setItem(SOUND_MUTE_KEY, muted ? '1' : '0');
      if (muted) silence(wrongVoices);
    }
  };
})();

</script>

<script>
/* Country database: built from the bundled rows (data/countries.js), so everything works offline.
   An optional online refresh can update populations. It never touches names, capitals, languages or
   which countries are playable. */

const ISO_CODES = COUNTRY_ROWS.trim().split('\n').map(line => line.split('|')[0]);

let DATA = COUNTRY_ROWS.trim().split('\n').map(line => {
  const [code, cca3, name, capital, continent, languages, thousands, playable] = line.split('|');
  return {
    code, cca3, name, capital,
    continent: CONTINENT_NAMES[continent] || '',
    languages: languages ? languages.split(';') : [],
    population: Number(thousands) * 1000,
    playable: playable === '1',
    independent: playable === '1' // used by Study Mode to pick the Wikipedia link
  };
});
const BY_CODE = new Map(DATA.map(c => [c.code, c]));
const BY_CCA3 = new Map(DATA.map(c => [c.cca3, c]));
const countryByCode = code => BY_CODE.get(code);

// Most familiar first, then everything else. Codes with no data row (e.g. XK) are dropped so tier sizes are exact.
const FAMILIARITY_RANKING = [...FAMILIARITY_CORE, ...ISO_CODES.filter(code => !FAMILIARITY_CORE.includes(code))].filter(code => BY_CODE.has(code));

let mapCountryIds = new Set(); // countries that have a clickable shape on the map (set by main.js)

/* ---------- expertise tiers ---------- */
const _expCache = {};
function expertiseCodes(level = expertise) {
  return _expCache[level] ??= buildExpertiseCodes(level);
}
function buildExpertiseCodes(level) {
  const limit = EXPERTISE_LIMITS[level] ?? 120;
  return new Set(Number.isFinite(limit) ? FAMILIARITY_RANKING.slice(0, limit) : FAMILIARITY_RANKING);
}
function expertiseLabel(level = expertise) {
  return level ? level[0].toUpperCase() + level.slice(1) : 'Intermediate';
}

/* ---------- pools used by the game modes ---------- */
// Flag mode uses every country and territory in the chosen tier.
function flagPool() {
  const allowed = expertiseCodes();
  return DATA.filter(c => allowed.has(c.code));
}
// Map mode uses sovereign states that have a shape on the map.
function mapPool() {
  const allowed = expertiseCodes();
  const pool = DATA.filter(c => allowed.has(c.code) && c.playable && mapCountryIds.has(c.code));
  return pool.length ? pool : DATA.filter(c => allowed.has(c.code) && c.playable);
}
function triviaPool() {
  return mapPool().filter(c => c.capital || c.languages.length);
}

/* ---------- optional online refresh (populations only) ---------- */
const REFRESH_PREF_KEY = 'geoLiveRefreshV1';
const POP_CACHE_KEY = 'geoPopulationV3', POP_CACHE_AGE = 86400000; // one day
let refreshState = 'off'; // off | pending | done | failed

const liveRefreshEnabled = () => LS.getItem(REFRESH_PREF_KEY) !== '0';
function setLiveRefreshEnabled(on) { LS.setItem(REFRESH_PREF_KEY, on ? '1' : '0'); }

// Ignore anything that disagrees wildly with the bundled number (bad API data).
function acceptPopulation(c, value) {
  const v = Number(value);
  if (!(v > 0)) return false;
  return !(c.population > 0 && (v / c.population > 2 || v / c.population < .5));
}
function applyPopulations(pairs) {
  let applied = 0;
  for (const [cca3, value, year] of pairs) {
    const c = BY_CCA3.get(cca3);
    if (c && c.playable && acceptPopulation(c, value)) { c.population = Number(value); c.populationYear = year; applied++; }
  }
  return applied;
}
async function fetchJson(url) {
  const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function worldBankPopulations() {
  try {
    const cached = JSON.parse(LS.getItem(POP_CACHE_KEY) || 'null');
    if (cached?.pairs && Date.now() - cached.savedAt < POP_CACHE_AGE) return cached.pairs;
  } catch { /* ignore */ }
  const j = await fetchJson('https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&mrv=1&per_page=400');
  const pairs = (j?.[1] || []).filter(x => x.value && x.countryiso3code).map(x => [x.countryiso3code, x.value, x.date]);
  LS.setItem(POP_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), pairs }));
  return pairs;
}
async function restCountriesPopulations() {
  const rows = await fetchJson('https://restcountries.com/v3.1/all?fields=cca3,population');
  return rows.map(r => [r.cca3, r.population, '']);
}
async function refreshCountryData() {
  if (!liveRefreshEnabled()) { refreshState = 'off'; updateCountryStatus(); return; }
  refreshState = 'pending';
  updateCountryStatus();
  for (const source of [worldBankPopulations, restCountriesPopulations]) {
    try {
      if (applyPopulations(await source()) >= 100) { refreshState = 'done'; updateCountryStatus(); return; }
    } catch { /* try the next source */ }
  }
  refreshState = 'failed';
  updateCountryStatus();
}

/* ---------- menu status line ---------- */
function updateCountryStatus() {
  const e = $('countryDataStatus');
  if (!e) return;
  const playable = DATA.filter(c => c.playable).length;
  const mapped = mapCountryIds.size ? DATA.filter(c => c.playable && mapCountryIds.has(c.code)).length : 'pending';
  const source = {
    off: 'bundled data',
    pending: 'bundled data, checking for fresher populations…',
    done: 'populations refreshed online',
    failed: 'offline, using bundled data'
  }[refreshState];
  e.textContent = `${DATA.length} flags · ${playable} countries · ${mapped} on the map · ${source}`;
}

function flagSources(code){code=code.toLowerCase();let preferred=flagPreferences()[code],order=FLAG_SOURCE_BUILDERS.map((_,i)=>i);if(Number.isInteger(preferred)&&order.includes(preferred))order=[preferred,...order.filter(i=>i!==preferred)];return order.map(index=>({index,url:FLAG_SOURCE_BUILDERS[index](code)}))}
function loadFlag(img,countryCode,{alt='',timeout=3500}={}){return new Promise(resolve=>{let code=countryCode.toLowerCase(),sources=flagSources(code),attempt=0,timer=0,finished=false;img.classList.add('loading');img.alt=alt||`${countryCode.toUpperCase()} flag`;const done=(ok,source='emoji')=>{if(finished)return;finished=true;clearTimeout(timer);img.onload=null;img.onerror=null;img.classList.remove('loading');resolve({ok,source})};const next=()=>{clearTimeout(timer);if(attempt>=sources.length){img.src=emojiFlagData(code);setTimeout(()=>done(false,'emoji'),0);return}let current=sources[attempt++];img.onload=()=>{rememberFlagSource(code,current.index);done(true,current.url)};img.onerror=next;timer=setTimeout(next,timeout);img.src=current.url};next()})}

<script>
/* Trivia question generator. Categories are rows in QUESTION_TYPES; the picker chooses a
   category by weight, then single vs multi-select inside it. */

let questionBag=[],questionHistory=[],lastCategories=[],triviaSinceMulti=0;
function resetQuestions(){questionBag=[];questionHistory=[];lastCategories=[];triviaSinceMulti=0}

function populationBands(){return[{label:'under 1 million',min:0,max:1e6},{label:'between 1 and 5 million',min:1e6,max:5e6},{label:'between 5 and 15 million',min:5e6,max:15e6},{label:'between 15 and 50 million',min:15e6,max:50e6},{label:'between 50 and 100 million',min:50e6,max:100e6},{label:'over 100 million',min:100e6,max:Infinity}]}
/* Bundled populations are rounded estimates, so a country within 6% of a band edge could land on either
   side. Those countries are left out of population questions rather than risk a wrong "correct" answer. */
function nearPopulationEdge(p){return[1e6,5e6,15e6,50e6,100e6].some(e=>Math.abs(p-e)/e<.06)}
/* Each trivia category is one row: how to list its groups, who matches a group, and the wording.
   To add a category, add a row here. */
const QUESTION_TYPES=[
  {category:'language',groups:cp=>[...new Set(cp.flatMap(c=>c.languages||[]))],match:(c,g)=>(c.languages||[]).includes(g),
   single:(ct,g)=>`Which country in ${ct} has ${g} as an official language?`,multi:(ct,g,n)=>`Pick ${n} countries in ${ct} where ${g} is an official language.`},
  {category:'population',groups:()=>populationBands().map(b=>b.label),match:(c,g)=>{let b=populationBands().find(x=>x.label===g);return c.population>0&&!nearPopulationEdge(c.population)&&c.population>=b.min&&c.population<b.max},
   single:(ct,g)=>`Which country in ${ct} has a population ${g}?`,multi:(ct,g,n)=>`Pick ${n} countries in ${ct} with populations ${g}.`}
];
let _cq=null,_cqKey='';
function candidateQuestions(){
  let pool=triviaPool(),key=`${expertise}|${pool.length}|${pool.filter(c=>c.population).length}|${pool.filter(c=>c.languages?.length).length}|${pool.filter(c=>c.continent).length}`;
  if(_cq&&_cqKey===key)return _cq;
  let out=[];
  pool.filter(c=>c.capital).forEach(c=>out.push({category:'capital',multi:false,required:1,eligible:[c.code],text:`Which country has ${c.capital} as its capital?`,signature:`capital:${c.code}`}));
  let enriched=pool.filter(c=>c.continent),continents=[...new Set(enriched.map(c=>c.continent))];
  for(let continent of continents){let cp=enriched.filter(c=>c.continent===continent);
    for(let t of QUESTION_TYPES)for(let g of t.groups(cp)){
      let eligible=cp.filter(c=>t.match(c,g)).map(c=>c.code);
      if(eligible.length===1)out.push({category:t.category,multi:false,required:1,eligible,text:t.single(continent,g),signature:`${t.category}:single:${continent}:${g}`});
      else if(eligible.length>=2)out.push({category:t.category,multi:true,eligible,text:null,continent,group:g,type:t,signature:`${t.category}:multi:${continent}:${g}`});
    }}
  _cq=out;_cqKey=key;return out}
/* Multi-select specs are templates; the required count is rolled when the question is actually asked. */
function resolveQuestion(q){if(q.text)return q;let n=Math.min(5,q.eligible.length,2+Math.floor(Math.random()*Math.min(4,q.eligible.length-1)));return{category:q.category,multi:true,required:n,eligible:q.eligible,text:q.type.multi(q.continent,q.group,n),signature:q.signature}}
function takeQuestion(predicate){let matches=questionBag.map((q,i)=>predicate(q)?i:-1).filter(i=>i>=0);if(!matches.length)return null;let index=matches[Math.floor(Math.random()*matches.length)];return questionBag.splice(index,1)[0]}
/* Category is chosen first by weight, then single vs multi inside it, so the mix no longer depends on how big each pool happens to be. */
const CATEGORY_WEIGHTS={capital:.4,language:.3,population:.3};
function finishQuestion(q){q=resolveQuestion(q);triviaSinceMulti=q.multi?0:triviaSinceMulti+1;questionHistory.push(q.signature);questionHistory=questionHistory.slice(-20);lastCategories.push(q.category);lastCategories=lastCategories.slice(-3);return q}
/* Top up any category whose questions ran out, so no category is starved while another drains. */
function topUpBag(){let all=candidateQuestions(),recent=questionHistory.slice(-15),added=false;
  for(let cat of new Set(all.map(q=>q.category))){if(questionBag.some(q=>q.category===cat))continue;
    let mine=all.filter(q=>q.category===cat),fresh=mine.filter(q=>!recent.includes(q.signature));questionBag.push(...(fresh.length?fresh:mine));added=true}
  if(added)shuffle(questionBag)}
function nextTriviaQuestion(){
  topUpBag();
  let present=[...new Set(questionBag.map(q=>q.category))],last=lastCategories.slice(-2),usable=present.filter(c=>!(last.length===2&&last.every(x=>x===c)));
  if(!usable.length)usable=present;
  if(usable.length){
    let w=c=>CATEGORY_WEIGHTS[c]||.2,r=Math.random()*usable.reduce((a,c)=>a+w(c),0),cat=usable[0];
    for(let c of usable){r-=w(c);if(r<=0){cat=c;break}}
    let hasMulti=questionBag.some(q=>q.category===cat&&q.multi),wantMulti=hasMulti&&(triviaSinceMulti>=2||Math.random()<.4);
    let q=takeQuestion(x=>x.category===cat&&x.multi===wantMulti)||takeQuestion(x=>x.category===cat);
    if(q)return finishQuestion(q);
  }
  let options=shuffle(triviaPool().filter(x=>x.capital&&!questionHistory.includes(`capital:${x.code}`)));if(!options.length)options=shuffle(triviaPool().filter(x=>x.capital));
  let c=options[0];if(!c)throw new Error('No valid trivia questions are available.');
  return finishQuestion({category:'capital',multi:false,required:1,eligible:[c.code],text:`Which country has ${c.capital} as its capital?`,signature:`capital:${c.code}`})
}

<script>
/* MapView: everything that touches amCharts lives here.
   The game logic (game.js) only talks to this object, so the map library can be
   swapped or stubbed without touching game rules. */

// The free amCharts licence shows a small amCharts logo in the corner of the map.
// Removing it requires a paid amCharts licence, so the logo stays on.
const KEEP_AMCHARTS_LOGO = true;

/* ---------- reveal circles: a dashed ring drawn around each revealed country ----------
   Lives in an SVG layer over the map (#revealLayer) and knows nothing about amCharts: MapView passes a
   projector per country that returns the country's outline in layer pixels for the current pan/zoom. */
const CIRCLE_MIN_R = 24;          // tiny countries still get a visible ring
const CIRCLE_PAD = 12;            // breathing room between the outline and the ring
const CIRCLE_DRAW_MS = 700;       // time for the ring to draw itself once around
const CIRCLE_MARCH_PX_PER_MS = 0.03;
const MAX_REVEAL_CIRCLES = 5;

// Circle around projected points: centred on their bounding box, radius half its diagonal plus padding.
function circleAround(points, { minR = CIRCLE_MIN_R, maxR = Infinity, pad = CIRCLE_PAD } = {}) {
  if (!points || !points.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const r = Math.min(maxR, Math.max(minR, Math.hypot(maxX - minX, maxY - minY) / 2 + pad));
  return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, r };
}

// An outline spanning more than 180° of longitude crosses the antimeridian (Russia's Chukotka, Fiji).
// Its far-side points project to the other edge of the map, so keep only the side with most points.
function trimAntimeridian(ring) {
  if (!ring || !ring.length) return ring;
  let min = Infinity, max = -Infinity;
  for (const [lon] of ring) { if (lon < min) min = lon; if (lon > max) max = lon; }
  if (max - min <= 180) return ring;
  const east = ring.filter(([lon]) => lon >= 0), west = ring.filter(([lon]) => lon < 0);
  return east.length >= west.length ? east : west;
}

const RevealCircles = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let layer = null, rings = [], frame = 0, startedAt = 0, maxR = Infinity, maskSeq = 0;

  const el = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  // Each ring is a dashed circle revealed by a mask whose solid stroke grows around it ("drawing" it).
  function makeRing(project) {
    const id = `revealMask${++maskSeq}`;
    const group = el('g');
    const mask = el('mask', { id, maskUnits: 'userSpaceOnUse' });
    const reveal = el('circle', { class: 'revealCircleMask' });
    mask.appendChild(reveal);
    const ring = el('circle', { class: 'revealCircle', mask: `url(#${id})` });
    group.append(mask, ring);
    layer.appendChild(group);
    return { project, group, ring, reveal };
  }

  function tick(now) {
    const t = now - startedAt;
    const drawn = Math.min(1, t / CIRCLE_DRAW_MS);
    for (const r of rings) {
      const c = circleAround(r.project(), { maxR });
      if (!c) { r.group.setAttribute('visibility', 'hidden'); continue; }
      r.group.setAttribute('visibility', 'visible');
      const length = 2 * Math.PI * c.r;
      for (const circle of [r.ring, r.reveal]) {
        circle.setAttribute('cx', c.cx);
        circle.setAttribute('cy', c.cy);
        circle.setAttribute('r', c.r);
      }
      // Start drawing at 12 o'clock, clockwise.
      r.reveal.setAttribute('transform', `rotate(-90 ${c.cx} ${c.cy})`);
      r.reveal.setAttribute('stroke-dasharray', `${length} ${length}`);
      r.reveal.setAttribute('stroke-dashoffset', length * (1 - drawn));
      // Once drawn, the dashes keep marching around the country.
      r.ring.setAttribute('stroke-dashoffset', -t * CIRCLE_MARCH_PX_PER_MS);
    }
    frame = requestAnimationFrame(tick);
  }

  function start(svg, projectors, opts = {}) {
    stop();
    layer = svg;
    maxR = opts.maxR ?? Infinity;
    startedAt = performance.now();
    rings = projectors.slice(0, MAX_REVEAL_CIRCLES).map(makeRing);
    frame = requestAnimationFrame(tick);
  }

  function stop() {
    cancelAnimationFrame(frame);
    frame = 0;
    rings = [];
    layer?.replaceChildren();
  }

  return { start, stop };
})();

const MapView = (() => {
  // Colours come from the CSS tokens (css/style.css :root), read once when the chart is built.
  let C = null;
  const palette = () => (C ||= {
    land: tokenHex('map-land'), line: tokenHex('bg'), hover: tokenHex('text-2'),
    select: tokenHex('accent'), reveal: tokenHex('good'), outline: tokenHex('text')
  });
  const ZOOM_STEP = 1.5;
  const FLASH_MS = 900; // one fade out-and-back of the revealed country's green
  // One mouse-wheel notch (100px) zooms one ZOOM_STEP; smaller touchpad scrolls zoom proportionally less.
  const WHEEL_ZOOM_PER_PX = Math.log(ZOOM_STEP) / 100;

  let root = null, chart = null, series = null;
  let fittedSize = '';
  let wheelTarget = 0, lastWheel = 0, lastPageScroll = 0;
  let flashes = [];
  let highlightedIds = new Set();
  let revealTimer = 0, revealResolve = null, revealToken = 0;
  let hooks = { onPick() {}, isSelected: () => false, showNames: () => true, showFlags: () => false, onData() {} };
  let resolveReady = null;
  const ready = new Promise(r => { resolveReady = r; });

  const idOf = p => p.dataItem?.get('id');
  const available = () =>
    typeof am5 !== 'undefined' && typeof am5map !== 'undefined' && typeof am5geodata_worldLow !== 'undefined';

  function init(h) { hooks = { ...hooks, ...h }; }

  function polygonsFor(ids) {
    const out = [];
    if (!series) return out;
    series.mapPolygons.each(p => { if (ids.includes(idOf(p))) out.push(p); });
    return out;
  }
  function polygonFor(id) {
    let found = null;
    series?.mapPolygons.each(p => { if (idOf(p) === id) found = p; });
    return found;
  }

  /* ---------- reveal geometry ---------- */
  function largestRing(geometry) {
    if (!geometry?.coordinates) return null;
    const rings = geometry.type === 'Polygon' ? geometry.coordinates
      : geometry.type === 'MultiPolygon' ? geometry.coordinates.flatMap(part => part) : [];
    let best = null, bestArea = -1;
    for (const ring of rings) {
      if (!Array.isArray(ring) || ring.length < 3) continue;
      const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]);
      const area = (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys));
      if (area > bestArea) { bestArea = area; best = ring; }
    }
    return best;
  }
  // The country's main landmass in #revealLayer pixels for the current pan/zoom (convert() includes both).
  function outlineProjector(polygon) {
    const ring = trimAntimeridian(largestRing(polygon?.dataItem?.get('geometry')));
    return () => (ring && chart ? ring.map(([longitude, latitude]) => chart.convert({ longitude, latitude })) : []);
  }

  /* ---------- polygon painting ---------- */
  function resetPolygon(p) {
    p.set('forceInactive', false);
    p.states.apply('default');
    p.setAll({ fill: am5.color(palette().land), stroke: am5.color(palette().line), strokeWidth: .8 });
  }
  function paintSelection(p, on) {
    p.set('active', !!on);
    if (on) {
      p.states.apply('active');
      p.setAll({ stroke: am5.color(palette().outline), strokeWidth: 2.2 });
    } else resetPolygon(p);
  }
  function select(id, on) {
    const p = polygonFor(id);
    if (p) paintSelection(p, on);
  }

  /* ---------- the "here is the answer" reveal ---------- */
  function cleanup() {
    revealToken++;
    clearTimeout(revealTimer);
    highlightedIds.clear();
    flashes.forEach(anim => { try { anim.stop(); } catch {} });
    flashes = [];
    RevealCircles.stop();
    const token = revealToken;
    if (series) {
      series.mapPolygons.each(resetPolygon);
      // Second pass next frame, unless a new reveal started in the meantime.
      requestAnimationFrame(() => { if (token === revealToken) series?.mapPolygons.each(resetPolygon); });
    }
    hide('revealNotice');
  }
  // Abort a reveal. The pending highlight() promise resolves false.
  function clearHighlight() {
    const done = revealResolve;
    revealResolve = null;
    cleanup();
    done?.(false);
  }
  // Finish a reveal early. The pending highlight() promise resolves true.
  function skipReveal() {
    const done = revealResolve;
    revealResolve = null;
    cleanup();
    done?.(true);
  }
  // Resolves true when the reveal ran its course (or was skipped), false when aborted.
  function highlight(ids, { duration = 5000, color = palette().reveal, label = '' } = {}) {
    clearHighlight();
    const token = ++revealToken;
    highlightedIds = new Set(ids);
    const polys = polygonsFor(ids);
    polys.forEach(p => {
      p.states.apply('default');
      p.set('forceInactive', true);
      p.setAll({ fill: am5.color(color), stroke: am5.color(palette().outline), strokeWidth: 2.5 });
      // Fade to the land colour and back, over and over, until cleanup() stops it.
      flashes.push(p.animate({
        key: 'fill', from: am5.color(color), to: am5.color(palette().land),
        duration: FLASH_MS, loops: Infinity, easing: am5.ease.yoyo(am5.ease.inOut(am5.ease.quad))
      }));
    });
    const layer = $('revealLayer');
    const box = layer.getBoundingClientRect();
    RevealCircles.start(layer, polys.map(outlineProjector), { maxR: 0.6 * Math.max(box.width, box.height) });
    if (label) { setText('revealNotice', label); show('revealNotice'); }
    return new Promise(resolve => {
      revealResolve = resolve;
      revealTimer = setTimeout(() => { if (token === revealToken) skipReveal(); }, duration);
    });
  }

  /* ---------- view controls ---------- */
  const zoomIn = () => chart?.zoomIn();
  const zoomOut = () => chart?.zoomOut();
  function resetView(immediate = false) {
    chart?.zoomToGeoPoint({ longitude: 0, latitude: 12 }, 1, true, immediate ? 0 : 500);
  }
  // amCharts records the map's centre (which the drag limits are measured from) only when it fits the map.
  // The chart is built while the map is hidden (0x0), so that fit is skipped and dragging gets clamped
  // against the wrong centre. Re-fit whenever the visible size changes. Returns true if a re-fit was queued.
  function refitIfResized() {
    const el = $('mapArea');
    const size = `${el.clientWidth}x${el.clientHeight}`;
    if (!chart || el.clientWidth === 0 || el.clientHeight === 0 || size === fittedSize) return false;
    fittedSize = size;
    root.resize();
    chart.markDirtyGeometries();
    return true;
  }
  function resizeAndReset() {
    if (!root) return;
    setTimeout(() => {
      // The re-fit happens on amCharts' next frame and resets the view itself, so reset after it.
      if (refitIfResized()) root.events.once('frameended', () => resetView(true));
      else resetView(true);
    }, 20);
  }

  // amCharts' own wheel zoom jumps a full step for every wheel event, however small. Touchpads send dozens
  // of tiny events per swipe, which sent the map straight to maximum zoom. This zooms by how far you scrolled.
  function onWheel(e) {
    if (!chart) return;
    // A non-cancelable wheel event belongs to a page scroll that is still coasting onto the map. Leave it be.
    if (!e.cancelable || performance.now() - lastPageScroll < 200) return;
    const level = chart.get('zoomLevel', 1);
    const min = chart.get('minZoomLevel', 1), max = chart.get('maxZoomLevel', 24);
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 33;                                  // lines
    else if (e.deltaMode === 2) dy *= e.currentTarget.clientHeight;   // pages
    // Fully zoomed out and scrolling down: let the page scroll instead.
    if (dy > 0 && level <= min + 1e-6) return;
    e.preventDefault();
    if (dy === 0) return;
    dy = Math.max(-150, Math.min(150, dy));
    // Keep zooming from where the last wheel event was heading, so quick notches are not lost mid-animation.
    const now = performance.now();
    const from = now - lastWheel < 250 ? wheelTarget : level;
    lastWheel = now;
    wheelTarget = Math.max(min, Math.min(max, from * Math.exp(-dy * WHEEL_ZOOM_PER_PX)));
    if (wheelTarget === level) return;
    chart.zoomToPoint(root.documentPointToRoot({ x: e.clientX, y: e.clientY }), wheelTarget, false, 120);
  }
  function setTooltips(on) {
    series?.mapPolygons.template.set('tooltipText', on ? '{name}' : '');
  }
  function waitReady(timeoutMs = 8000) {
    return Promise.race([ready, new Promise(r => setTimeout(r, timeoutMs))]);
  }

  /* ---------- one-time construction ---------- */
  function ensure() {
    if (root) return;
    root = am5.Root.new('mapArea');
    if (!KEEP_AMCHARTS_LOGO) root._logo?.dispose();
    chart = root.container.children.push(am5map.MapChart.new(root, {
      panX: 'translateX', panY: 'translateY', wheelX: 'none', wheelY: 'none', pinchZoom: true,
      zoomStep: ZOOM_STEP, minZoomLevel: 1, maxZoomLevel: 24, projection: am5map.geoNaturalEarth1()
    }));
    $('mapArea').addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('scroll', () => { lastPageScroll = performance.now(); }, { passive: true });
    // Window resized mid-game: re-fit so dragging stays correct.
    new ResizeObserver(() => {
      if (refitIfResized()) root.events.once('frameended', () => resetView(true));
    }).observe($('mapArea'));
    series = chart.series.push(am5map.MapPolygonSeries.new(root, { geoJSON: am5geodata_worldLow, exclude: ['AQ'] }));

    series.events.on('datavalidated', () => {
      const ids = new Set();
      series.mapPolygons.each(p => { const id = idOf(p); if (id && countryByCode(id)) ids.add(id); });
      hooks.onData(ids);
      if (resolveReady) { resolveReady(); resolveReady = null; }
    });

    const tpl = series.mapPolygons.template;
    tpl.setAll({
      tooltipText: hooks.showNames() ? '{name}' : '', interactive: true,
      fill: am5.color(palette().land), stroke: am5.color(palette().line), strokeWidth: .8
    });
    tpl.states.create('hover', { fill: am5.color(palette().hover) });
    tpl.states.create('active', { fill: am5.color(palette().select), stroke: am5.color(palette().outline), strokeWidth: 2.2 });

    tpl.events.on('pointerover', e => {
      const polygon = e.target, id = idOf(polygon);
      if (hooks.isSelected(id)) requestAnimationFrame(() => polygon.states.apply('active'));
      else if (!highlightedIds.has(id)) { polygon.states.apply('default'); polygon.set('fill', am5.color(palette().land)); }
      if (!hooks.showFlags()) return;
      const c = countryByCode(id);
      if (!c) return;
      const panel = $('hoverFlag'), img = $('hoverFlagImg');
      panel.dataset.code = id;
      setText('hoverFlagName', hooks.showNames() ? c.name : '');
      panel.classList.add('show');
      loadFlag(img, id, { alt: `${c.name} flag`, timeout: 1800 }).then(() => {
        if (panel.dataset.code !== id) panel.classList.remove('show');
      });
    });
    tpl.events.on('pointerout', e => {
      const panel = $('hoverFlag');
      panel.dataset.code = '';
      panel.classList.remove('show');
      const polygon = e.target, id = idOf(polygon);
      if (hooks.isSelected(id)) paintSelection(polygon, true);
      else if (!highlightedIds.has(id)) resetPolygon(polygon);
    });
    tpl.events.on('click', e => {
      const id = e.target.dataItem.get('id');
      if (countryByCode(id)) hooks.onPick(id);
    });
  }

  return {
    available, init, ensure, ready, waitReady, setTooltips,
    select, highlight, clearHighlight, skipReveal,
    zoomIn, zoomOut, resetView, resizeAndReset
  };
})();

</script>
<script>
/* Local leaderboard: top 10 per mode + difficulty + expertise, kept in localStorage. */

let scoreSaved = false;

const scoreKey = () => `geoScores_${mode}_${difficulty}_${expertise}`;

function readScores() {
  try {
    const a = JSON.parse(LS.getItem(scoreKey()) || '[]');
    return Array.isArray(a) ? a.filter(x => x && typeof x.name === 'string' && Number.isFinite(x.score)) : [];
  } catch { return []; }
}

function renderBoard() {
  const rows = readScores().sort((a, b) => b.score - a.score).slice(0, 10);
  const el = $('board');
  el.replaceChildren();
  if (!rows.length) {
    const p = document.createElement('p');
    p.textContent = 'No scores yet.';
    el.append(p);
    return;
  }
  rows.forEach((x, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    const rank = document.createElement('b'); rank.className = 'rank'; rank.textContent = i + 1;
    const name = document.createElement('span'); name.className = 'player'; name.textContent = x.name;
    const pts = document.createElement('b'); pts.className = 'pts'; pts.textContent = x.score;
    row.append(rank, name, pts);
    el.append(row);
  });
}

function saveScore() {
  if (scoreSaved) return;
  const name = $('name').value.trim();
  if (!name) return;
  const all = readScores();
  all.push({ name, score });
  LS.setItem(scoreKey(), JSON.stringify(all.sort((a, b) => b.score - a.score).slice(0, 10)));
  scoreSaved = true;
  $('saveBtn').disabled = true;
  renderBoard();
  Sound.play('saved');
}

// A new run (or leaving the menu) makes the next game-over save-able again.
function resetScoreSaved() { scoreSaved = false; }

</script>
<script>
/* Game flow, built around one explicit state machine.

   idle ──▶ loading ──▶ asking ──▶ between ──▶ loading ...        (right answer, next question)
                           │
                           └──▶ revealing ──▶ over               (lost: show the answer, then game over)
                                    └──▶ study ──▶ over          (flag mode with Study Mode on)

   Anything can fall back to `idle` (back to the menu) or restart at `loading` (new game).
   Rules that used to be scattered flags are now one question: "what state are we in?"
     - answers are only accepted in `asking`
     - the clock only runs in `asking`
     - every delayed callback is cancelled whenever a run ends, and every await re-checks `stale(rid)`
*/

const DIFFICULTY_SECONDS = { easy: 20, normal: 10, hard: 5, extreme: 3 };
// After a Flag-mode loss, how long the marked answer tiles stay visible before the overlay covers them.
const FLAG_REVEAL_MS = 1000;

// A state may only be entered from the listed states ('*' = from anywhere).
const ALLOWED_FROM = {
  idle: '*',
  loading: '*',
  asking: ['loading'],
  between: ['asking'],
  revealing: ['asking'],
  study: ['revealing'],
  over: ['revealing', 'study']
};

let state = 'idle';
let mode = null, difficulty = 'normal', expertise = 'intermediate';
let duration = 10, maxTime = 10, score = 0;
let target = null, questionSpec = null;
let runId = 0, flagRetries = 0, recentTargets = [];
let selectedIds = new Set();
let pendingLoss = null;

function setState(next) {
  const allowed = ALLOWED_FROM[next];
  if (allowed !== '*' && !allowed?.includes(state)) {
    console.warn(`Ignored invalid state change: ${state} -> ${next}`);
    return false;
  }
  state = next;
  document.body.dataset.state = next;
  return true;
}
const stale = rid => rid !== runId;

/* ---------- delayed callbacks that die with the run ---------- */
const timers = new Set();
function later(fn, ms) {
  const h = setTimeout(() => { timers.delete(h); fn(); }, ms);
  timers.add(h);
  return h;
}
function cancelTimers() { timers.forEach(clearTimeout); timers.clear(); }

/* ---------- the countdown ---------- */
const Clock = (() => {
  let raf = 0, startAt = 0, max = 10, running = false, pausedAt = 0, onExpire = () => {};
  const now = () => performance.now();
  const ref = () => pausedAt || now();
  const ratio = () => Math.max(0, 1 - (ref() - startAt) / (max * 1000));
  // Timer colours step from calm to urgent; read from the CSS tokens once, not every frame.
  let steps = null;
  function paint(r) {
    steps ||= { calm: token('accent'), warn: token('hot'), urgent: token('bad') };
    const c = r > .5 ? steps.calm : r > .25 ? steps.warn : steps.urgent;
    $('timerBar').style.transform = `scaleX(${r})`;
    $('timerBar').style.background = c;
    $('time').style.color = c;
    $('time').textContent = Math.ceil(r * max) + 's';
  }
  function tick() {
    if (!running) return;
    const r = ratio();
    paint(r);
    if (r > 0 && r <= .25) Sound.tick(Math.ceil(r * max)); // red zone: one tick per shown second
    if (r <= 0) { running = false; onExpire(); return; }
    raf = requestAnimationFrame(tick);
  }
  return {
    start(seconds, cb) {
      max = seconds; onExpire = cb; running = true; pausedAt = 0; startAt = now();
      Sound.resetTick();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    },
    stop() { running = false; pausedAt = 0; cancelAnimationFrame(raf); Sound.resetTick(); },
    pause() { if (running && !pausedAt) { pausedAt = now(); cancelAnimationFrame(raf); } },
    resume() { if (running && pausedAt) { startAt += now() - pausedAt; pausedAt = 0; raf = requestAnimationFrame(tick); } },
    ratio,
    // Remove time. Returns the seconds left; at 0 the clock stops (the caller ends the round).
    penalize(seconds) {
      const left = Math.max(0, max - (ref() - startAt) / 1000 - seconds);
      if (left <= 0) { running = false; cancelAnimationFrame(raf); paint(0); return 0; }
      startAt = ref() - (max - left) * 1000;
      return left;
    }
  };
})();

/* ---------- selection (map and trivia) ---------- */
function clearSelections() {
  selectedIds.forEach(id => MapView.select(id, false));
  selectedIds.clear();
  updateSelectionUI();
}
function updateSelectionUI() {
  const required = questionSpec?.required || 1, count = selectedIds.size;
  setText('selectionProgress', `Selected: ${count} / ${required}`);
  $('confirmSelection').disabled = count !== required || state !== 'asking';
}
function selectMapCountry(id) {
  if (state !== 'asking' || mode === 'flag' || !questionSpec) return;
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
    MapView.select(id, false);
    Sound.play('unpick');
    updateSelectionUI();
    return;
  }
  const required = questionSpec.required || 1;
  if (required === 1) {
    selectedIds.forEach(old => MapView.select(old, false));
    selectedIds.clear();
  } else if (selectedIds.size >= required) {
    showReaction('Selection full', token('text-2'), 'selectionFull');
    Sound.play('full');
    return;
  }
  selectedIds.add(id);
  MapView.select(id, true);
  Sound.play('pick');
  updateSelectionUI();
}
function confirmMapSelection() {
  if (state !== 'asking' || !questionSpec || selectedIds.size !== (questionSpec.required || 1)) return;
  const correct = [...selectedIds].every(id => questionSpec.eligible.includes(id));
  if (!correct) { applyPenalty(); return; }
  onCorrect(questionSpec.multi ? questionSpec.required : 1, 700);
}

/* ---------- outcomes ---------- */
function onCorrect(points, delayMs) {
  const r = Clock.ratio();
  if (!setState('between')) return;
  Clock.stop();
  score += points;
  setText('score', score);
  showReaction(points > 1 ? `Correct! +${points} points` : (r > .7 ? 'Damn!' : r > .35 ? 'Nice!' : 'Close!'), token('good'), '');
  Sound.play('correct', r); // faster answers sound bigger
  clearSelections();
  const rid = runId;
  later(() => askNext(rid), delayMs);
}

function applyPenalty() {
  const r = Clock.ratio(); // before the penalty: how much time the player had used
  const seconds = Math.max(1, Math.floor(maxTime * .33));
  const left = Clock.penalize(seconds);
  const track = $('timerBar').parentElement;
  track.classList.remove('penalty');
  void track.offsetWidth;
  track.classList.add('penalty');
  later(() => track.classList.remove('penalty'), 520);
  showReaction(`Wrong! −${seconds} second${seconds === 1 ? '' : 's'}`);
  clearSelections();
  Sound.play('wrong', left <= 0 ? 1 : 1 - r);
  if (left <= 0) { Sound.play('timesUp', 0, 0.5); lose('The time penalty ran out the clock!'); } // buzzer after the wrong sound
}

async function lose(reason, pickedCode = null) {
  if (state !== 'asking') return;
  const rid = runId;
  setState('revealing');
  Clock.stop();
  clearSelections();
  const eligible = mode === 'flag' ? [target.code] : (questionSpec?.eligible || [target.code]);
  if (mode === 'flag') {
    // Show the player's pick (red) and the right answer (green) before the modal or Study card covers them.
    markAnswers(pickedCode, target.code);
    await new Promise(resolve => later(resolve, FLAG_REVEAL_MS));
    if (stale(rid) || state !== 'revealing') return;
  } else {
    const names = eligible.map(id => countryByCode(id)?.name).filter(Boolean);
    const completed = await MapView.highlight(eligible, {
      duration: 5000,
      label: eligible.length > 1 ? `Eligible answers: ${names.join(', ')}` : `Correct answer: ${names[0]}`
    });
    if (stale(rid) || state !== 'revealing' || !completed) return;
  }
  const countries = eligible.map(id => countryByCode(id)).filter(Boolean);
  if (mode === 'flag' && $('studyMode').checked && countries[0]) { openStudyCard(countries[0], reason); return; }
  showGameOver(reason, countries);
}

function showGameOver(reason, countries) {
  if (!setState('over')) return;
  setText('final', score);
  setText('correct', countries.map(c => c.name).join(', '));
  setText('reason', reason);
  $('saveBtn').disabled = false;
  show('modal');
  Sound.play('runOver');
}

function openStudyCard(country, reason) {
  if (!setState('study')) return;
  const entry = flagStudyEntry(country);
  pendingLoss = { reason, country };
  setText('studyTitle', `About ${country.name}’s flag`);
  $('studySummary').classList.remove('loading');
  setText('studySummary', entry.summary);
  $('studyReadMore').href = entry.source;
  $('studyReadMore').title = `Open a detailed flag explanation for ${country.name}`;
  $('studyReadMore').classList.toggle('hidden', !entry.source);
  loadFlag($('studyFlag'), country.code, { alt: `${country.name} flag`, timeout: 2500 });
  show('studyCard');
}
function continueFromStudy() {
  if (state !== 'study' || !pendingLoss) return;
  const { reason, country } = pendingLoss;
  pendingLoss = null;
  hide('studyCard');
  showGameOver(reason, [country]);
}

/* ---------- asking questions ---------- */
function pickTarget(pool) {
  const keep = Math.max(1, Math.min(10, Math.floor(pool.length / 2)));
  let opts = pool.filter(c => !recentTargets.includes(c.code));
  if (!opts.length) opts = pool;
  const c = opts[Math.floor(Math.random() * opts.length)];
  recentTargets.push(c.code);
  recentTargets = recentTargets.slice(-keep);
  return c;
}

function beginAsking(seconds, rid) {
  if (stale(rid) || !setState('asking')) return;
  Clock.start(seconds, () => { Sound.play('timesUp'); lose('Time’s up!'); });
  updateSelectionUI();
}

async function askNext(rid) {
  if (stale(rid)) return;
  MapView.clearHighlight();
  clearSelections();
  if (!setState('loading')) return;

  if (mode === 'flag') {
    hide('questionActions');
    target = pickTarget(flagPool());
    setText('question', 'Which country is this?');
    show('flagArea'); hide('mapWrap');
    const options = shuffle([target, ...shuffle(flagPool().filter(x => x.code !== target.code)).slice(0, 3)]);
    $('answers').replaceChildren(...options.map((x, i) => {
      const b = document.createElement('button');
      b.className = 'answer';
      b.dataset.code = x.code;
      b.textContent = `${i + 1}. ${x.name}`;
      b.addEventListener('click', () => onFlagAnswer(x.code));
      return b;
    }));
    const res = await loadFlag($('flag'), target.code, { alt: 'Mystery country flag', timeout: 3500 });
    if (stale(rid)) return;
    // The emoji fallback can leak the answer (two letters on Windows), so re-roll a few times first.
    if (!res.ok && flagRetries < 5) { flagRetries++; return askNext(rid); }
    flagRetries = 0;
    maxTime = duration;
    beginAsking(maxTime, rid);
    return;
  }

  show('questionActions'); hide('flagArea'); show('mapWrap');
  $('answers').replaceChildren();
  if (mode === 'map') {
    target = pickTarget(mapPool());
    questionSpec = { category: 'map', multi: false, required: 1, eligible: [target.code], text: `Find ${target.name}` };
  } else {
    questionSpec = nextTriviaQuestion();
    target = countryByCode(questionSpec.eligible[0]);
  }
  setText('question', questionSpec.text);
  maxTime = duration + (questionSpec.multi ? questionSpec.required * Math.max(2, Math.round(duration / 2)) : 0);
  MapView.resizeAndReset();
  beginAsking(maxTime, rid);
}

function onFlagAnswer(code) {
  if (state !== 'asking' || mode !== 'flag') return;
  if (code === target.code) { markAnswers(code, code); onCorrect(1, 650); return; }
  Sound.play('wrong', 1 - Clock.ratio());
  lose('Wrong answer.', code);
}

// Marks the picked and the correct flag answer. markAnswers(null, null) clears the marks.
function markAnswers(pickedCode, correctCode) {
  $('answers').querySelectorAll('.answer').forEach(b => {
    b.classList.toggle('is-correct', b.dataset.code === correctCode);
    b.classList.toggle('is-wrong', b.dataset.code === pickedCode && pickedCode !== correctCode);
  });
}

/* ---------- trivia readiness ---------- */
function triviaReadiness() {
  const mapped = mapCountryIds.size, trivia = mapPool().filter(c => c.capital).length;
  return { mapped, trivia, ready: mapped >= 20 && trivia >= 20 };
}
async function waitForTriviaReady() {
  setText('question', 'Preparing the expanded trivia database…');
  hide('questionActions');
  await MapView.waitReady(8000);
  const st = triviaReadiness();
  if (!st.ready && mapPool().filter(c => c.capital).length < 10) throw new Error('Trivia data could not be prepared.');
  resetQuestions();
  const candidates = candidateQuestions();
  const multi = candidates.filter(q => q.multi).length;
  const cats = [...new Set(candidates.map(q => q.category))];
  const counts = cats.map(c =>
    `${c} ${candidates.filter(q => q.category === c && !q.multi).length}/${candidates.filter(q => q.category === c && q.multi).length}`).join(' · ');
  console.info('Trivia question pool (single/multi):', counts);
  setText('countryDataStatus', `Trivia ready: ${triviaPool().length} countries · ${candidates.length} questions · ${multi} multi-select · single/multi: ${counts}`);
  return candidates.length;
}

/* ---------- starting, restarting, leaving ---------- */
// Stop everything belonging to the current run. Callers bump runId first.
function resetRun() {
  cancelTimers();
  Clock.stop();
  MapView.clearHighlight();
  clearSelections();
  pendingLoss = null;
  hide('studyCard');
  hide('modal');
}

async function startGame(m) {
  if (m !== 'flag' && !MapView.available()) {
    setText('countryDataStatus', 'The map library failed to load. Check your connection and reload. Flag mode still works.');
    return;
  }
  runId++;
  const rid = runId;
  resetRun();
  setState('loading');

  mode = m;
  difficulty = document.querySelector('[name=difficulty]:checked').value;
  expertise = document.querySelector('[name=expertise]:checked').value;
  duration = DIFFICULTY_SECONDS[difficulty];
  score = 0; target = null; questionSpec = null; recentTargets = []; flagRetries = 0;
  resetQuestions();
  resetScoreSaved();
  setText('score', 0);

  hide('menu'); show('game');
  const label = m === 'flag' ? 'Flag' : m === 'map' ? 'Map' : 'Trivia';
  setText('modeLabel', `${label.toUpperCase()} · ${difficulty.toUpperCase()} · ${expertise.toUpperCase()}`);
  setText('boardTitle', `🏆 ${label} · ${difficulty[0].toUpperCase() + difficulty.slice(1)} · ${expertiseLabel()} Top 10`);
  renderBoard();

  if (m !== 'flag') { MapView.ensure(); MapView.setTooltips($('showNames').checked); }
  if (m === 'flag') preloadFlags();
  if (m === 'map') { await MapView.waitReady(8000); if (stale(rid)) return; }
  if (m === 'trivia') {
    try { await waitForTriviaReady(); }
    catch (error) {
      if (stale(rid)) return;
      setText('question', error.message);
      showReaction('Trivia data unavailable', token('bad'), 'penaltyBurst');
      return;
    }
    if (stale(rid)) return;
  }
  askNext(rid);
}

function showMenu() {
  runId++;
  resetRun();
  setState('idle');
  hide('game'); show('menu');
}

</script>
<script>
/* Wiring: connects the page's buttons and keys to the game, and starts loading data.
   Loaded last. Nothing else touches the page's event listeners. */

MapView.init({
  onPick: selectMapCountry,
  isSelected: id => selectedIds.has(id),
  showNames: () => $('showNames').checked,
  showFlags: () => $('showFlags').checked,
  onData: ids => { mapCountryIds = ids; updateCountryStatus(); }
});

/* ---------- menu ---------- */
document.querySelectorAll('[data-mode]').forEach(btn =>
  btn.addEventListener('click', () => startGame(btn.dataset.mode)));
document.querySelectorAll('[name=expertise]').forEach(r =>
  r.addEventListener('change', () => { expertise = r.value; updateCountryStatus(); }));

/* ---------- in game ---------- */
$('backBtn').addEventListener('click', showMenu);
$('confirmSelection').addEventListener('click', confirmMapSelection);
$('zoomInBtn').addEventListener('click', () => MapView.zoomIn());
$('zoomOutBtn').addEventListener('click', () => MapView.zoomOut());
$('zoomResetBtn').addEventListener('click', () => MapView.resetView());

/* ---------- study card and game over ---------- */
$('studyContinue').addEventListener('click', continueFromStudy);
$('saveBtn').addEventListener('click', saveScore);
$('againBtn').addEventListener('click', () => startGame(mode));
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') saveScore(); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('game').classList.contains('hidden') || !$('modal').classList.contains('hidden') || !$('studyCard').classList.contains('hidden')) return;
  const active = document.activeElement;
  const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
  if (typing) return;

  if (mode === 'flag' && state === 'asking') {
    const i = '1234'.indexOf(e.key);
    if (i >= 0) $('answers').children[i]?.click();
    return;
  }
  if (e.code !== 'Space') return;
  if (mode !== 'flag' && state === 'asking' && !$('confirmSelection').disabled) {
    e.preventDefault();
    Sound.play('click');
    confirmMapSelection();
  } else if (state === 'revealing') {
    e.preventDefault();
    Sound.play('click');
    MapView.skipReveal(); // skip the 5-second answer reveal
  }
});

/* ---------- sound ---------- */
const SOUND_TARGETS = 'button, .difficulty label, .answer, .mapControl';
// Browsers only allow audio after a user gesture; every gesture also wakes a suspended context.
// Touch only counts on release, so pointerup/touchend/click are listened to as well.
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(type => document.addEventListener(type, Sound.unlock, true));
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return; // a tap would otherwise play hover and click together
  const el = e.target.closest?.(SOUND_TARGETS);
  if (!el || el.disabled || el === e.relatedTarget?.closest?.(SOUND_TARGETS)) return;
  Sound.play('hover');
});
// Mouse, Enter/Space on a focused button and the 1-4 keys (which call .click()) all land here.
document.addEventListener('click', e => { if (e.target.closest?.(SOUND_TARGETS)) Sound.play('click'); });

function renderMute() {
  const muted = Sound.isMuted();
  document.querySelectorAll('.muteBtn').forEach(b => {
    b.textContent = muted ? '🔇' : '🔊';
    b.setAttribute('aria-pressed', String(muted));
    b.title = muted ? 'Unmute sounds (M)' : 'Mute sounds (M)';
  });
}
function toggleMute() {
  Sound.setMuted(!Sound.isMuted());
  renderMute();
}
document.querySelectorAll('.muteBtn').forEach(b => b.addEventListener('click', toggleMute));
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || (e.key || '').toLowerCase() !== 'm') return;
  const a = document.activeElement;
  const typing = a && (a.tagName === 'TEXTAREA' || a.isContentEditable ||
    (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'radio'));
  if (!typing) toggleMute();
});
renderMute();

/* ---------- pause the clock while the tab is hidden ---------- */
document.addEventListener('visibilitychange', () => {
  if (state !== 'asking') return;
  if (document.hidden) Clock.pause(); else Clock.resume();
});

/* ---------- data ---------- */
$('liveRefresh').checked = liveRefreshEnabled();
$('liveRefresh').addEventListener('change', e => {
  setLiveRefreshEnabled(e.target.checked);
  refreshCountryData(); // turning it on fetches now; turning it off takes effect on the next page load
});
updateCountryStatus();
refreshCountryData();

</script>
</body>
